<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EriAI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #f7f8ff;
    --text: #181526;
    --muted: #817b91;
    --purple: #8b5cf6;
    --blue: #5790ff;
    --pink: #ed72dc;
    --border: rgba(110,80,180,.14);
    --panel: rgba(255,255,255,.72);
    --bubble: rgba(255,255,255,.82);
    --input: rgba(255,255,255,.86);
    --shadow: rgba(60,40,110,.10);
}

body.dark {
    --bg: #0d0b18;
    --text: #f5f1ff;
    --muted: #aaa2bd;
    --border: rgba(180,150,255,.15);
    --panel: rgba(24,20,39,.78);
    --bubble: rgba(27,23,44,.88);
    --input: rgba(25,21,40,.88);
    --shadow: rgba(0,0,0,.35);
}

body {
    min-height: 100vh;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--text);
    background:
        radial-gradient(circle at 5% 5%, rgba(139,92,246,.20), transparent 25%),
        radial-gradient(circle at 95% 5%, rgba(87,144,255,.18), transparent 25%),
        radial-gradient(circle at 50% 100%, rgba(237,114,220,.13), transparent 30%),
        var(--bg);
    overflow: hidden;
    transition: background .35s ease, color .35s ease;
}

body::before,
body::after {
    content: "";
    position: fixed;
    width: 420px;
    height: 420px;
    border-radius: 50%;
    filter: blur(110px);
    opacity: .16;
    pointer-events: none;
    z-index: -1;
    animation: floatGlow 12s ease-in-out infinite alternate;
}

body::before {
    background: var(--purple);
    left: -200px;
    top: -180px;
}

body::after {
    background: var(--blue);
    right: -200px;
    bottom: -200px;
}

@keyframes floatGlow {
    from { transform: translate(0,0) scale(1); }
    to { transform: translate(70px,50px) scale(1.18); }
}

/* APP */

.app {
    height: 100vh;
    display: flex;
}

/* SIDEBAR */

.sidebar {
    width: 285px;
    height: 100vh;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    padding: 18px;
    background: var(--panel);
    backdrop-filter: blur(30px);
    border-right: 1px solid var(--border);
    transition: transform .3s ease, width .3s ease;
}

.sidebar-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 11px;
}

.logo {
    width: 43px;
    height: 43px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    color: white;
    background: linear-gradient(135deg,#a777ff,#5790ff,#ef75dc);
    box-shadow:
        0 8px 25px rgba(139,92,246,.25),
        0 0 35px rgba(87,144,255,.13);
}

.brand-text h1 {
    font-size: 18px;
    font-weight: 750;
}

.brand-text span {
    display: block;
    margin-top: 2px;
    color: var(--muted);
    font-size: 11px;
}

.new-chat {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    border: 1px solid rgba(139,92,246,.18);
    border-radius: 14px;
    background: var(--bubble);
    color: var(--text);
    font-size: 14px;
    font-weight: 650;
    cursor: pointer;
    box-shadow: 0 6px 20px var(--shadow);
    transition: .2s;
}

.new-chat:hover {
    transform: translateY(-2px);
    border-color: rgba(139,92,246,.35);
    box-shadow: 0 10px 28px rgba(139,92,246,.12);
}

/* SEARCH */

.search-box {
    position: relative;
    margin-top: 10px;
}

.search-box input {
    width: 100%;
    padding: 10px 12px 10px 34px;
    border: 1px solid var(--border);
    border-radius: 12px;
    outline: none;
    background: var(--bubble);
    color: var(--text);
    font-size: 12px;
}

.search-box span {
    position: absolute;
    left: 11px;
    top: 8px;
    color: var(--muted);
}

/* HISTORY */

.history-title {
    margin: 22px 8px 9px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .8px;
}

.chat-list {
    flex: 1;
    overflow-y: auto;
    padding-right: 3px;
}

.chat-item {
    position: relative;
    display: flex;
    align-items: center;
    width: 100%;
    margin-bottom: 5px;
    padding: 9px 8px;
    border: 1px solid transparent;
    border-radius: 12px;
    background: transparent;
    cursor: pointer;
    transition: .18s;
}

.chat-item:hover {
    background: var(--bubble);
    border-color: var(--border);
}

.chat-item.active {
    background: var(--bubble);
    border-color: rgba(139,92,246,.20);
    box-shadow: 0 5px 20px var(--shadow);
}

.chat-icon {
    width: 29px;
    height: 29px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 8px;
    border-radius: 9px;
    background: linear-gradient(135deg,rgba(139,92,246,.16),rgba(87,144,255,.14));
    color: #8b5cf6;
}

.chat-title {
    min-width: 0;
    flex: 1;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    color: var(--text);
    font-size: 13px;
}

.chat-actions {
    display: flex;
    gap: 2px;
    opacity: 0;
}

.chat-item:hover .chat-actions,
.chat-item.active .chat-actions {
    opacity: 1;
}

.small-btn {
    width: 25px;
    height: 25px;
    border: none;
    border-radius: 7px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
}

.small-btn:hover {
    background: rgba(139,92,246,.10);
    color: var(--purple);
}

.small-btn.delete:hover {
    color: #df6088;
    background: rgba(223,96,136,.10);
}

/* SIDEBAR BOTTOM */

.sidebar-bottom {
    padding-top: 13px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 6px;
}

.bottom-btn {
    flex: 1;
    padding: 9px 4px;
    border: none;
    border-radius: 10px;
    background: transparent;
    color: var(--muted);
    font-size: 11px;
    cursor: pointer;
    transition: .2s;
}

.bottom-btn:hover {
    background: var(--bubble);
    color: var(--text);
}

/* MAIN */

.main {
    position: relative;
    min-width: 0;
    flex: 1;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

.header {
    height: 68px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    padding: 0 22px;
    border-bottom: 1px solid var(--border);
    background: rgba(255,255,255,.35);
    backdrop-filter: blur(20px);
}

body.dark .header {
    background: rgba(13,11,24,.35);
}

.menu-btn {
    display: none;
    width: 38px;
    height: 38px;
    margin-right: 10px;
    border: 1px solid var(--border);
    border-radius: 11px;
    background: var(--bubble);
    color: var(--text);
    cursor: pointer;
}

/* CHAT */

#chat {
    flex: 1;
    overflow-y: auto;
    padding: 35px 20px 165px;
    scroll-behavior: smooth;
}

.welcome {
    max-width: 720px;
    margin: 9vh auto 0;
    text-align: center;
    animation: appear .7s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(16px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.welcome-orb {
    width: 92px;
    height: 92px;
    margin: 0 auto 24px;
    border-radius: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 39px;
    color: white;
    background: linear-gradient(135deg,#ae7cff,#6ea3ff,#ef83df);
    box-shadow:
        0 15px 45px rgba(139,92,246,.25),
        0 0 70px rgba(87,144,255,.14);
    animation: orbFloat 4s ease-in-out infinite;
}

@keyframes orbFloat {
    0%,100% { transform: translateY(0) rotate(0); }
    50% { transform: translateY(-6px) rotate(2deg); }
}

.welcome h2 {
    font-size: clamp(35px,6vw,56px);
    letter-spacing: -2.5px;
    background: linear-gradient(100deg,#28213b,#8052d8,#4384dd);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

body.dark .welcome h2 {
    background: linear-gradient(100deg,#fff,#b58cff,#75a7ff);
    -webkit-background-clip: text;
}

.welcome p {
    margin-top: 12px;
    color: var(--muted);
    font-size: 15px;
}

.suggestions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-top: 28px;
}

.suggestion {
    padding: 11px 15px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--bubble);
    color: var(--muted);
    cursor: pointer;
    transition: .2s;
}

.suggestion:hover {
    transform: translateY(-3px);
    color: var(--purple);
    border-color: rgba(139,92,246,.32);
    box-shadow: 0 10px 30px rgba(139,92,246,.10);
}

/* MESSAGES */

.message {
    display: flex;
    max-width: 850px;
    margin: 18px auto;
    animation: messageIn .3s ease;
}

.message.user {
    justify-content: flex-end;
}

.message-wrap {
    max-width: 78%;
}

.bubble {
    padding: 14px 17px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.65;
    white-space: pre-wrap;
}

.user .bubble {
    color: white;
    background: linear-gradient(135deg,#8b5cf6,#578cff);
    border-bottom-right-radius: 5px;
    box-shadow: 0 10px 30px rgba(98,76,220,.20);
}

.assistant .bubble {
    background: var(--bubble);
    border: 1px solid rgba(139,92,246,.12);
    border-bottom-left-radius: 5px;
    box-shadow: 0 8px 30px var(--shadow);
    backdrop-filter: blur(18px);
}

.message-tools {
    display: flex;
    gap: 4px;
    margin-top: 5px;
    padding-left: 4px;
}

.tool-btn {
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 12px;
    padding: 4px 6px;
    border-radius: 7px;
}

.tool-btn:hover {
    color: var(--purple);
    background: rgba(139,92,246,.08);
}

.tool-btn.selected {
    color: var(--purple);
}

@keyframes messageIn {
    from {
        opacity: 0;
        transform: translateY(9px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* THINKING */

.thinking {
    display: flex;
    align-items: center;
    gap: 5px;
}

.thinking span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #8b5cf6;
    animation: thinking 1.2s infinite;
}

.thinking span:nth-child(2) {
    animation-delay: .15s;
}

.thinking span:nth-child(3) {
    animation-delay: .3s;
}

@keyframes thinking {
    0%,60%,100% {
        transform: translateY(0);
        opacity: .35;
    }
    30% {
        transform: translateY(-5px);
        opacity: 1;
    }
}

/* COMPOSER */

.composer-area {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 20px 22px 24px;
    background: linear-gradient(
        to top,
        var(--bg),
        color-mix(in srgb, var(--bg) 82%, transparent),
        transparent
    );
}

.composer {
    max-width: 850px;
    margin: auto;
    display: flex;
    align-items: flex-end;
    gap: 6px;
    padding: 10px;
    border: 1px solid rgba(139,92,246,.18);
    border-radius: 21px;
    background: var(--input);
    backdrop-filter: blur(25px);
    box-shadow: 0 12px 45px var(--shadow);
    transition: .25s;
}

.composer:focus-within {
    border-color: rgba(139,92,246,.45);
    box-shadow:
        0 12px 50px var(--shadow),
        0 0 40px rgba(139,92,246,.11);
}

textarea {
    flex: 1;
    min-height: 48px;
    max-height: 150px;
    resize: none;
    padding: 13px 10px;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 15px;
}

textarea::placeholder {
    color: var(--muted);
}

#voice {
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    border: none;
    border-radius: 13px;
    background: transparent;
    color: var(--muted);
    font-size: 17px;
    cursor: pointer;
}

#voice:hover,
#voice.listening {
    color: var(--purple);
    background: rgba(139,92,246,.10);
}

#send {
    width: 48px;
    height: 48px;
    flex-shrink: 0;
    border: none;
    border-radius: 15px;
    color: white;
    font-size: 18px;
    cursor: pointer;
    background: linear-gradient(135deg,#9a67fa,#5b91ff);
    box-shadow: 0 8px 25px rgba(105,80,220,.25);
    transition: .2s;
}

#send:hover {
    transform: translateY(-2px) scale(1.03);
    box-shadow: 0 10px 35px rgba(105,80,220,.38);
}

.footer {
    text-align: center;
    margin-top: 8px;
    color: var(--muted);
    font-size: 11px;
}

/* MOBILE */

@media (max-width: 750px) {
    .sidebar {
        position: fixed;
        z-index: 50;
        left: 0;
        top: 0;
        transform: translateX(-100%);
        box-shadow: 15px 0 50px rgba(50,30,100,.20);
    }

    .sidebar.open {
        transform: translateX(0);
    }

    .menu-btn {
        display: block;
    }

    .message-wrap {
        max-width: 88%;
    }

    #chat {
        padding-left: 14px;
        padding-right: 14px;
    }
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar" id="sidebar">

    <div class="sidebar-top">
        <div class="brand">
            <div class="logo">✦</div>
            <div class="brand-text">
                <h1>EriAI</h1>
                <span>Your personal AI</span>
            </div>
        </div>
    </div>

    <button class="new-chat" onclick="newChat()">
        <span>＋</span>
        New chat
    </button>

    <div class="search-box">
        <span>⌕</span>
        <input
            id="searchInput"
            type="text"
            placeholder="Search conversations..."
            oninput="renderChatList()"
        >
    </div>

    <div class="history-title">
        Conversations
    </div>

    <div class="chat-list" id="chatList"></div>

    <div class="sidebar-bottom">
        <button class="bottom-btn" onclick="toggleTheme()" id="themeBtn">
            ☾ Dark
        </button>

        <button class="bottom-btn" onclick="deleteAllChats()">
            🗑 Clear
        </button>
    </div>

</aside>

<main class="main">

    <header class="header">
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    </header>

    <section id="chat"></section>

    <div class="composer-area">

        <div class="composer">

            <textarea
                id="question"
                placeholder="Message EriAI..."
                rows="1"
            ></textarea>

            <button id="voice" onclick="toggleVoice()" title="Voice input">
                🎙
            </button>

            <button id="send" onclick="askEriAI()">
                ➤
            </button>

        </div>

        <div class="footer">
            EriAI runs locally with Ollama
        </div>

    </div>

</main>

</div>

<script>

const STORAGE_KEY = "eriai_chats";
const THEME_KEY = "eriai_theme";

let chats = [];
let currentChatId = null;
let history = [];

const questionInput =
    document.getElementById("question");

const chat =
    document.getElementById("chat");

const chatList =
    document.getElementById("chatList");


/* =========================
   LOAD
========================= */

function loadChats() {

    try {
        chats =
            JSON.parse(
                localStorage.getItem(STORAGE_KEY)
            ) || [];
    } catch {
        chats = [];
    }

    const savedTheme =
        localStorage.getItem(THEME_KEY);

    if (savedTheme === "dark") {
        document.body.classList.add("dark");
    }

    updateThemeButton();
    renderChatList();
    renderMessages();
}


/* =========================
   SAVE
========================= */

function saveChats() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(chats)
    );

    renderChatList();
}


/* =========================
   CREATE
========================= */

function createChat() {

    const newConversation = {
        id: Date.now().toString(),
        title: "New conversation",
        messages: [],
        pinned: false,
        feedback: {},
        createdAt: Date.now(),
        updatedAt: Date.now()
    };

    chats.unshift(newConversation);

    currentChatId =
        newConversation.id;

    history = [];

    saveChats();

    return newConversation;
}


/* =========================
   NEW CHAT
========================= */

function newChat() {

    currentChatId = null;
    history = [];

    questionInput.value = "";
    questionInput.style.height = "48px";

    renderMessages();
    renderChatList();
    closeSidebarOnMobile();
}


/* =========================
   CURRENT CHAT
========================= */

function getCurrentChat() {

    return chats.find(
        item =>
            item.id === currentChatId
    );
}


/* =========================
   TITLE
========================= */

function makeTitle(text) {

    const clean =
        text.replace(/\s+/g, " ").trim();

    return clean.length > 34
        ? clean.substring(0,34) + "…"
        : clean || "New conversation";
}


/* =========================
   RENDER SIDEBAR
========================= */

function renderChatList() {

    chatList.innerHTML = "";

    const search =
        document
            .getElementById("searchInput")
            .value
            .toLowerCase()
            .trim();

    let filtered =
        chats.filter(item => {

            if (!search) {
                return true;
            }

            const text =
                item.title +
                " " +
                item.messages
                    .map(m => m.content)
                    .join(" ");

            return text
                .toLowerCase()
                .includes(search);
        });

    filtered.sort(
        (a,b) => {

            if (a.pinned && !b.pinned) {
                return -1;
            }

            if (!a.pinned && b.pinned) {
                return 1;
            }

            return (
                (b.updatedAt || 0) -
                (a.updatedAt || 0)
            );
        }
    );


    if (!filtered.length) {

        const empty =
            document.createElement("div");

        empty.style.padding = "20px 8px";
        empty.style.textAlign = "center";
        empty.style.color = "var(--muted)";
        empty.style.fontSize = "12px";

        empty.textContent =
            search
                ? "No matching conversations."
                : "No conversations yet.";

        chatList.appendChild(empty);

        return;
    }


    filtered.forEach(item => {

        const row =
            document.createElement("div");

        row.className =
            "chat-item" +
            (
                item.id === currentChatId
                    ? " active"
                    : ""
            );

        row.onclick =
            () => openChat(item.id);


        const icon =
            document.createElement("div");

        icon.className =
            "chat-icon";

        icon.textContent =
            item.pinned ? "📌" : "✦";


        const title =
            document.createElement("div");

        title.className =
            "chat-title";

        title.textContent =
            item.title;


        const actions =
            document.createElement("div");

        actions.className =
            "chat-actions";


        const pin =
            document.createElement("button");

        pin.className = "small-btn";
        pin.textContent =
            item.pinned ? "★" : "☆";
        pin.title =
            item.pinned
                ? "Unpin"
                : "Pin";

        pin.onclick =
            event => {

                event.stopPropagation();

                item.pinned =
                    !item.pinned;

                saveChats();
            };


        const rename =
            document.createElement("button");

        rename.className =
            "small-btn";

        rename.textContent =
            "✎";

        rename.title =
            "Rename";

        rename.onclick =
            event => {

                event.stopPropagation();

                renameChat(item.id);
            };


        const remove =
            document.createElement("button");

        remove.className =
            "small-btn delete";

        remove.textContent =
            "×";

        remove.title =
            "Delete";

        remove.onclick =
            event => {

                event.stopPropagation();

                deleteChat(item.id);
            };


        actions.appendChild(pin);
        actions.appendChild(rename);
        actions.appendChild(remove);

        row.appendChild(icon);
        row.appendChild(title);
        row.appendChild(actions);

        chatList.appendChild(row);
    });
}


/* =========================
   RENAME
========================= */

function renameChat(id) {

    const item =
        chats.find(
            chat => chat.id === id
        );

    if (!item) return;

    const newTitle =
        prompt(
            "Rename conversation:",
            item.title
        );

    if (
        newTitle !== null &&
        newTitle.trim()
    ) {

        item.title =
            newTitle.trim();

        item.updatedAt =
            Date.now();

        saveChats();
    }
}


/* =========================
   OPEN
========================= */

function openChat(id) {

    const item =
        chats.find(
            chat => chat.id === id
        );

    if (!item) return;

    currentChatId = id;

    history =
        [...item.messages];

    renderMessages();
    renderChatList();

    closeSidebarOnMobile();
}


/* =========================
   DELETE
========================= */

function deleteChat(id) {

    chats =
        chats.filter(
            item => item.id !== id
        );

    if (currentChatId === id) {

        currentChatId = null;
        history = [];

        renderMessages();
    }

    saveChats();
}


/* =========================
   DELETE ALL
========================= */

function deleteAllChats() {

    if (!chats.length) return;

    if (
        !confirm(
            "Delete all saved conversations?"
        )
    ) return;

    chats = [];
    currentChatId = null;
    history = [];

    localStorage.removeItem(
        STORAGE_KEY
    );

    renderChatList();
    renderMessages();
}


/* =========================
   SAVE CURRENT
========================= */

function saveCurrentChat() {

    if (!history.length) return;

    let item =
        getCurrentChat();

    if (!item) {

        item =
            createChat();
    }

    item.messages =
        [...history];

    const firstUser =
        history.find(
            message =>
                message.role === "user"
        );

    if (
        firstUser &&
        item.title === "New conversation"
    ) {

        item.title =
            makeTitle(
                firstUser.content
            );
    }

    item.updatedAt =
        Date.now();

    saveChats();
}


/* =========================
   RENDER MESSAGES
========================= */

function renderMessages() {

    chat.innerHTML = "";

    if (!history.length) {

        chat.innerHTML = `
            <div class="welcome">

                <div class="welcome-orb">✦</div>

                <h2>Meet EriAI</h2>

                <p>
                    Your personal AI assistant,
                    powered locally on your Mac.
                </p>

                <div class="suggestions">

                    <button
                        class="suggestion"
                        onclick="useSuggestion('What can you do?')"
                    >
                        What can you do?
                    </button>

                    <button
                        class="suggestion"
                        onclick="useSuggestion('Tell me something interesting')"
                    >
                        Tell me something interesting
                    </button>

                    <button
                        class="suggestion"
                        onclick="useSuggestion('Help me learn something new')"
                    >
                        Help me learn something new
                    </button>

                </div>

            </div>
        `;

        return;
    }

    history.forEach(
        (message,index) => {

            addMessageElement(
                message.role,
                message.content,
                index
            );

        }
    );

    chat.scrollTop =
        chat.scrollHeight;
}


/* =========================
   MESSAGE ELEMENT
========================= */

function addMessageElement(
    role,
    text,
    index = null
) {

    const message =
        document.createElement("div");

    message.className =
        "message " + role;


    const wrap =
        document.createElement("div");

    wrap.className =
        "message-wrap";


    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    bubble.textContent =
        text;


    wrap.appendChild(bubble);


    if (
        role === "assistant"
    ) {

        const tools =
            document.createElement("div");

        tools.className =
            "message-tools";


        const copy =
            document.createElement("button");

        copy.className =
            "tool-btn";

        copy.textContent =
            "📋 Copy";

        copy.onclick =
            () => copyText(text,copy);


        const like =
            document.createElement("button");

        like.className =
            "tool-btn";

        like.textContent =
            "👍";

        like.onclick =
            () => setFeedback(index,"up",like);


        const dislike =
            document.createElement("button");

        dislike.className =
            "tool-btn";

        dislike.textContent =
            "👎";

        dislike.onclick =
            () => setFeedback(index,"down",dislike);


        tools.appendChild(copy);
        tools.appendChild(like);
        tools.appendChild(dislike);

        wrap.appendChild(tools);
    }


    message.appendChild(wrap);

    chat.appendChild(message);
}


/* =========================
   COPY
========================= */

async function copyText(
    text,
    button
) {

    try {

        await navigator.clipboard.writeText(
            text
        );

        const old =
            button.textContent;

        button.textContent =
            "✓ Copied";

        setTimeout(
            () => {
                button.textContent =
                    old;
            },
            1200
        );

    } catch {

        alert(
            "Copy is not available in this browser."
        );
    }
}


/* =========================
   FEEDBACK
========================= */

function setFeedback(
    index,
    value,
    button
) {

    const item =
        getCurrentChat();

    if (!item) return;

    if (!item.feedback) {
        item.feedback = {};
    }

    item.feedback[index] =
        value;

    saveChats();

    button.classList.add(
        "selected"
    );
}


/* =========================
   THINKING
========================= */

function addThinking() {

    const message =
        document.createElement("div");

    message.className =
        "message assistant";

    message.id =
        "thinking-message";


    const wrap =
        document.createElement("div");

    wrap.className =
        "message-wrap";


    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    bubble.innerHTML = `
        <div class="thinking">
            <span></span>
            <span></span>
            <span></span>
        </div>
    `;

    wrap.appendChild(bubble);
    message.appendChild(wrap);

    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;
}


/* =========================
   ASK
========================= */

async function askEriAI() {

    const question =
        questionInput.value.trim();

    if (!question) return;


    if (!currentChatId) {

        const item =
            createChat();

        currentChatId =
            item.id;
    }


    questionInput.value = "";
    questionInput.style.height =
        "48px";


    addMessageElement(
        "user",
        question
    );


    history.push({
        role: "user",
        content: question
    });


    saveCurrentChat();

    addThinking();


    try {

        const response =
            await fetch(
                "/ask",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            question,
                            history:
                                history.slice(0,-1)
                        })
                }
            );


        if (!response.ok) {

            throw new Error(
                "Server returned " +
                response.status
            );
        }


        const data =
            await response.json();


        const thinking =
            document.getElementById(
                "thinking-message"
            );

        if (thinking) {
            thinking.remove();
        }


        const answer =
            data.answer ||
            "EriAI couldn't generate an answer.";


        history.push({
            role: "assistant",
            content: answer
        });


        addMessageElement(
            "assistant",
            answer,
            history.length - 1
        );


        saveCurrentChat();


        chat.scrollTop =
            chat.scrollHeight;


    } catch (error) {

        console.error(error);

        const thinking =
            document.getElementById(
                "thinking-message"
            );

        if (thinking) {
            thinking.remove();
        }

        addMessageElement(
            "assistant",
            "Something went wrong. Please make sure EriAI is running."
        );
    }
}


/* =========================
   SUGGESTIONS
========================= */

function useSuggestion(text) {

    questionInput.value =
        text;

    questionInput.focus();
}


/* =========================
   THEME
========================= */

function toggleTheme() {

    document.body.classList.toggle(
        "dark"
    );

    const dark =
        document.body.classList.contains(
            "dark"
        );

    localStorage.setItem(
        THEME_KEY,
        dark ? "dark" : "light"
    );

    updateThemeButton();
}


function updateThemeButton() {

    const button =
        document.getElementById(
            "themeBtn"
        );

    if (!button) return;

    const dark =
        document.body.classList.contains(
            "dark"
        );

    button.textContent =
        dark
            ? "☀ Light"
            : "☾ Dark";
}


/* =========================
   VOICE INPUT
========================= */

let recognition = null;
let listening = false;

function toggleVoice() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

        alert(
            "Voice input is not supported by this browser."
        );

        return;
    }


    if (listening) {

        recognition.stop();

        return;
    }


    recognition =
        new SpeechRecognition();

    recognition.lang =
        "en-US";

    recognition.interimResults =
        true;

    recognition.continuous =
        false;


    recognition.onstart =
        () => {

            listening = true;

            document
                .getElementById("voice")
                .classList.add(
                    "listening"
                );
        };


    recognition.onresult =
        event => {

            let text = "";

            for (
                let i = event.resultIndex;
                i < event.results.length;
                i++
            ) {

                text +=
                    event.results[i][0].transcript;
            }

            questionInput.value =
                text;
        };


    recognition.onend =
        () => {

            listening = false;

            document
                .getElementById("voice")
                .classList.remove(
                    "listening"
                );
        };


    recognition.onerror =
        error => {

            console.error(
                "Voice error:",
                error
            );

            listening = false;

            document
                .getElementById("voice")
                .classList.remove(
                    "listening"
                );
        };


    recognition.start();
}


/* =========================
   SIDEBAR
========================= */

function toggleSidebar() {

    document
        .getElementById("sidebar")
        .classList.toggle("open");
}


function closeSidebarOnMobile() {

    if (
        window.innerWidth <= 750
    ) {

        document
            .getElementById("sidebar")
            .classList.remove("open");
    }
}


/* =========================
   ENTER
========================= */

questionInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            askEriAI();
        }
    }
);


/* =========================
   TEXTAREA SIZE
========================= */

questionInput.addEventListener(
    "input",
    function() {

        this.style.height =
            "48px";

        this.style.height =
            Math.min(
                this.scrollHeight,
                150
            ) + "px";
    }
);


/* =========================
   START
========================= */

loadChats();

</script>
