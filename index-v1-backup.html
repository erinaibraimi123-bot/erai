<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EriAI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #f7f8ff;
    --text: #181526;
    --muted: #817b91;
    --purple: #8b5cf6;
    --blue: #5790ff;
    --pink: #ed72dc;
    --border: rgba(110, 80, 180, 0.14);
    --glass: rgba(255,255,255,0.76);
}

body {
    min-height: 100vh;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--text);
    background:
        radial-gradient(circle at 5% 5%, rgba(139,92,246,.20), transparent 25%),
        radial-gradient(circle at 95% 5%, rgba(87,144,255,.18), transparent 25%),
        radial-gradient(circle at 50% 100%, rgba(237,114,220,.13), transparent 30%),
        var(--bg);
    overflow: hidden;
}

/* Ambient glow */

body::before,
body::after {
    content: "";
    position: fixed;
    width: 420px;
    height: 420px;
    border-radius: 50%;
    filter: blur(110px);
    opacity: .18;
    pointer-events: none;
    z-index: -1;
    animation: floatGlow 12s ease-in-out infinite alternate;
}

body::before {
    background: var(--purple);
    left: -200px;
    top: -180px;
}

body::after {
    background: var(--blue);
    right: -200px;
    bottom: -200px;
    animation-delay: -5s;
}

@keyframes floatGlow {
    from {
        transform: translate(0,0) scale(1);
    }

    to {
        transform: translate(70px,50px) scale(1.18);
    }
}

/* APP */

.app {
    height: 100vh;
    display: flex;
}

/* SIDEBAR */

.sidebar {
    width: 280px;
    height: 100vh;
    flex-shrink: 0;

    display: flex;
    flex-direction: column;

    padding: 18px;

    background: rgba(255,255,255,.68);
    backdrop-filter: blur(30px);

    border-right: 1px solid var(--border);

    transition:
        width .3s ease,
        transform .3s ease;
}

.sidebar-top {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 18px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 11px;
}

.logo {
    width: 43px;
    height: 43px;

    border-radius: 14px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 21px;

    color: white;

    background:
        linear-gradient(
            135deg,
            #a777ff,
            #5790ff,
            #ef75dc
        );

    box-shadow:
        0 8px 25px rgba(139,92,246,.25),
        0 0 35px rgba(87,144,255,.13);

    animation: logoGlow 3s ease-in-out infinite;
}

@keyframes logoGlow {
    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-2px);
        box-shadow:
            0 10px 35px rgba(139,92,246,.35),
            0 0 45px rgba(87,144,255,.18);
    }
}

.brand-text h1 {
    font-size: 18px;
    font-weight: 750;
}

.brand-text span {
    display: block;
    margin-top: 2px;
    color: #918b9e;
    font-size: 11px;
}

.new-chat {
    width: 100%;

    display: flex;
    align-items: center;
    gap: 10px;

    padding: 12px 14px;

    border: 1px solid rgba(139,92,246,.18);
    border-radius: 14px;

    background: rgba(255,255,255,.72);

    color: #5d438e;

    font-size: 14px;
    font-weight: 650;

    cursor: pointer;

    box-shadow: 0 6px 20px rgba(80,50,130,.05);

    transition: .2s;
}

.new-chat:hover {
    transform: translateY(-2px);

    background: white;

    border-color: rgba(139,92,246,.35);

    box-shadow:
        0 10px 28px rgba(139,92,246,.12);
}

.new-chat-icon {
    font-size: 19px;
}

/* HISTORY */

.history-title {
    margin:
        25px 8px
        9px;

    color: #aaa4b4;

    font-size: 11px;
    font-weight: 700;

    text-transform: uppercase;
    letter-spacing: .8px;
}

.chat-list {
    flex: 1;
    overflow-y: auto;
    padding-right: 3px;
}

.chat-list::-webkit-scrollbar {
    width: 5px;
}

.chat-list::-webkit-scrollbar-thumb {
    background: rgba(139,92,246,.18);
    border-radius: 20px;
}

.chat-item {
    position: relative;

    display: flex;
    align-items: center;

    width: 100%;

    margin-bottom: 5px;

    padding: 10px 10px;

    border: 1px solid transparent;
    border-radius: 12px;

    background: transparent;

    cursor: pointer;

    transition: .18s;
}

.chat-item:hover {
    background: rgba(255,255,255,.72);
    border-color: var(--border);
}

.chat-item.active {
    background: rgba(255,255,255,.88);
    border-color: rgba(139,92,246,.18);

    box-shadow:
        0 5px 20px rgba(80,50,130,.06);
}

.chat-icon {
    width: 28px;
    height: 28px;

    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    margin-right: 9px;

    border-radius: 9px;

    background:
        linear-gradient(
            135deg,
            rgba(139,92,246,.14),
            rgba(87,144,255,.13)
        );

    font-size: 13px;
}

.chat-title {
    min-width: 0;
    flex: 1;

    overflow: hidden;

    white-space: nowrap;
    text-overflow: ellipsis;

    color: #60596f;

    font-size: 13px;
}

.delete-chat {
    opacity: 0;

    width: 25px;
    height: 25px;

    border: none;
    border-radius: 8px;

    background: transparent;

    color: #aaa1b1;

    cursor: pointer;

    transition: .15s;
}

.chat-item:hover .delete-chat {
    opacity: 1;
}

.delete-chat:hover {
    color: #e05c88;
    background: rgba(224,92,136,.10);
}

/* SIDEBAR BOTTOM */

.sidebar-bottom {
    padding-top: 15px;

    border-top: 1px solid var(--border);
}

.delete-all {
    width: 100%;

    padding: 10px;

    border: none;
    border-radius: 11px;

    background: transparent;

    color: #a095a8;

    font-size: 12px;

    cursor: pointer;

    transition: .2s;
}

.delete-all:hover {
    background: rgba(220,80,120,.08);
    color: #d15c82;
}

/* MAIN */

.main {
    position: relative;

    min-width: 0;
    flex: 1;

    height: 100vh;

    display: flex;
    flex-direction: column;
}

/* HEADER */

.header {
    height: 68px;

    flex-shrink: 0;

    display: flex;
    align-items: center;

    padding: 0 22px;

    border-bottom: 1px solid var(--border);

    background: rgba(255,255,255,.45);

    backdrop-filter: blur(20px);
}

.menu-btn {
    display: none;

    width: 38px;
    height: 38px;

    margin-right: 10px;

    border: 1px solid var(--border);
    border-radius: 11px;

    background: rgba(255,255,255,.65);

    cursor: pointer;

    font-size: 17px;
}

/* CHAT */

#chat {
    flex: 1;

    overflow-y: auto;

    padding:
        35px
        20px
        165px;

    scroll-behavior: smooth;
}

#chat::-webkit-scrollbar {
    width: 6px;
}

#chat::-webkit-scrollbar-thumb {
    background: rgba(139,92,246,.18);
    border-radius: 20px;
}

/* WELCOME */

.welcome {
    max-width: 720px;

    margin:
        9vh auto
        0;

    text-align: center;

    animation: appear .7s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(16px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.welcome-orb {
    width: 92px;
    height: 92px;

    margin: 0 auto 24px;

    border-radius: 28px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 39px;

    color: white;

    background:
        linear-gradient(
            135deg,
            #ae7cff,
            #6ea3ff,
            #ef83df
        );

    box-shadow:
        0 15px 45px rgba(139,92,246,.25),
        0 0 70px rgba(87,144,255,.14);

    animation: orbFloat 4s ease-in-out infinite;
}

@keyframes orbFloat {
    0%,100% {
        transform: translateY(0) rotate(0);
    }

    50% {
        transform: translateY(-6px) rotate(2deg);
    }
}

.welcome h2 {
    font-size:
        clamp(35px,6vw,56px);

    letter-spacing: -2.5px;

    background:
        linear-gradient(
            100deg,
            #28213b,
            #8052d8,
            #4384dd
        );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.welcome p {
    margin-top: 12px;

    color: var(--muted);

    font-size: 15px;
}

.suggestions {
    display: flex;
    flex-wrap: wrap;

    justify-content: center;

    gap: 10px;

    margin-top: 28px;
}

.suggestion {
    padding: 11px 15px;

    border: 1px solid var(--border);
    border-radius: 14px;

    background: rgba(255,255,255,.65);

    color: #686177;

    cursor: pointer;

    transition: .2s;
}

.suggestion:hover {
    transform: translateY(-3px);

    color: #6742b1;

    background: white;

    border-color: rgba(139,92,246,.32);

    box-shadow:
        0 10px 30px rgba(139,92,246,.10);
}

/* MESSAGES */

.message {
    display: flex;

    max-width: 850px;

    margin: 18px auto;

    animation: messageIn .3s ease;
}

.message.user {
    justify-content: flex-end;
}

.bubble {
    max-width: 75%;

    padding: 14px 17px;

    border-radius: 18px;

    font-size: 15px;
    line-height: 1.65;

    white-space: pre-wrap;
}

.user .bubble {
    color: white;

    background:
        linear-gradient(
            135deg,
            #8b5cf6,
            #578cff
        );

    border-bottom-right-radius: 5px;

    box-shadow:
        0 10px 30px rgba(98,76,220,.20);
}

.assistant .bubble {
    background: rgba(255,255,255,.80);

    border: 1px solid rgba(139,92,246,.12);

    border-bottom-left-radius: 5px;

    box-shadow:
        0 8px 30px rgba(70,50,110,.07);

    backdrop-filter: blur(18px);
}

@keyframes messageIn {
    from {
        opacity: 0;
        transform: translateY(9px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* THINKING */

.thinking {
    display: flex;
    align-items: center;
    gap: 5px;
}

.thinking span {
    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #8b5cf6;

    animation: thinking 1.2s infinite;
}

.thinking span:nth-child(2) {
    animation-delay: .15s;
}

.thinking span:nth-child(3) {
    animation-delay: .3s;
}

@keyframes thinking {
    0%,60%,100% {
        transform: translateY(0);
        opacity: .35;
    }

    30% {
        transform: translateY(-5px);
        opacity: 1;
    }
}

/* COMPOSER */

.composer-area {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    padding:
        20px
        22px
        24px;

    background:
        linear-gradient(
            to top,
            rgba(247,248,255,.99),
            rgba(247,248,255,.82),
            transparent
        );
}

.composer {
    max-width: 850px;

    margin: auto;

    display: flex;
    align-items: flex-end;

    gap: 10px;

    padding: 10px;

    border: 1px solid rgba(139,92,246,.18);
    border-radius: 21px;

    background: rgba(255,255,255,.84);

    backdrop-filter: blur(25px);

    box-shadow:
        0 12px 45px rgba(70,50,120,.10),
        0 0 40px rgba(139,92,246,.05);

    transition: .25s;
}

.composer:focus-within {
    border-color: rgba(139,92,246,.45);

    box-shadow:
        0 12px 50px rgba(70,50,120,.12),
        0 0 40px rgba(139,92,246,.11);
}

textarea {
    flex: 1;

    min-height: 48px;
    max-height: 150px;

    resize: none;

    padding: 13px 12px;

    border: none;
    outline: none;

    background: transparent;

    color: #211b30;

    font: inherit;
    font-size: 15px;
}

textarea::placeholder {
    color: #aaa4b7;
}

#send {
    width: 48px;
    height: 48px;

    flex-shrink: 0;

    border: none;
    border-radius: 15px;

    color: white;

    font-size: 18px;

    cursor: pointer;

    background:
        linear-gradient(
            135deg,
            #9a67fa,
            #5b91ff
        );

    box-shadow:
        0 8px 25px rgba(105,80,220,.25);

    transition: .2s;
}

#send:hover {
    transform: translateY(-2px) scale(1.03);

    box-shadow:
        0 10px 35px rgba(105,80,220,.38);
}

.footer {
    text-align: center;

    margin-top: 8px;

    color: #aaa5b5;

    font-size: 11px;
}

/* MOBILE */

@media (max-width: 750px) {

    .sidebar {
        position: fixed;

        z-index: 50;

        left: 0;
        top: 0;

        transform: translateX(-100%);

        box-shadow:
            15px 0 50px rgba(50,30,100,.12);
    }

    .sidebar.open {
        transform: translateX(0);
    }

    .menu-btn {
        display: block;
    }

    .bubble {
        max-width: 88%;
    }

    #chat {
        padding-left: 14px;
        padding-right: 14px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar" id="sidebar">

        <div class="sidebar-top">

            <div class="brand">

                <div class="logo">✦</div>

                <div class="brand-text">
                    <h1>EriAI</h1>
                    <span>Local AI • Online</span>
                </div>

            </div>

        </div>

        <button
            class="new-chat"
            onclick="newChat()"
        >
            <span class="new-chat-icon">＋</span>
            New chat
        </button>

        <div class="history-title">
            Conversations
        </div>

        <div
            class="chat-list"
            id="chatList"
        ></div>

        <div class="sidebar-bottom">

            <button
                class="delete-all"
                onclick="deleteAllChats()"
            >
                🗑 Delete all conversations
            </button>

        </div>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <header class="header">

            <button
                class="menu-btn"
                onclick="toggleSidebar()"
            >
                ☰
            </button>

        </header>


        <section id="chat">

            <div
                class="welcome"
                id="welcome"
            >

                <div class="welcome-orb">
                    ✦
                </div>

                <h2>Meet EriAI</h2>

                <p>
                    Your personal AI assistant,
                    powered locally on your Mac.
                </p>

                <div class="suggestions">

                    <button
                        class="suggestion"
                        onclick="useSuggestion('What can you do?')"
                    >
                        What can you do?
                    </button>

                    <button
                        class="suggestion"
                        onclick="useSuggestion('Tell me something interesting')"
                    >
                        Tell me something interesting
                    </button>

                    <button
                        class="suggestion"
                        onclick="useSuggestion('Help me learn something new')"
                    >
                        Help me learn something new
                    </button>

                </div>

            </div>

        </section>


        <div class="composer-area">

            <div class="composer">

                <textarea
                    id="question"
                    placeholder="Message EriAI..."
                    rows="1"
                ></textarea>

                <button
                    id="send"
                    onclick="askEriAI()"
                >
                    ➤
                </button>

            </div>

            <div class="footer">
                EriAI runs locally with Ollama
            </div>

        </div>

    </main>

</div>


<script>

/* =========================================
   CHAT STORAGE
========================================= */

const STORAGE_KEY = "eriai_chats";

let chats = [];

let currentChatId = null;

let history = [];


/* =========================================
   ELEMENTS
========================================= */

const questionInput =
    document.getElementById("question");

const chat =
    document.getElementById("chat");

const chatList =
    document.getElementById("chatList");


/* =========================================
   LOAD SAVED CHATS
========================================= */

function loadChats() {

    try {

        const saved =
            localStorage.getItem(STORAGE_KEY);

        chats =
            saved
                ? JSON.parse(saved)
                : [];

    } catch (error) {

        console.error(
            "Could not load chats:",
            error
        );

        chats = [];
    }

    renderChatList();
}


/* =========================================
   SAVE CHATS
========================================= */

function saveChats() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(chats)
    );

    renderChatList();
}


/* =========================================
   CREATE CHAT
========================================= */

function createChat() {

    const id =
        Date.now().toString();

    const newChat = {

        id: id,

        title: "New conversation",

        messages: [],

        createdAt:
            Date.now()
    };

    chats.unshift(newChat);

    currentChatId = id;

    history = [];

    saveChats();

    renderMessages();

    return newChat;
}


/* =========================================
   NEW CHAT
========================================= */

function newChat() {

    currentChatId = null;

    history = [];

    questionInput.value = "";

    renderMessages();

    closeSidebarOnMobile();
}


/* =========================================
   GET CURRENT CHAT
========================================= */

function getCurrentChat() {

    return chats.find(
        chat =>
            chat.id === currentChatId
    );
}


/* =========================================
   MAKE CHAT TITLE
========================================= */

function makeTitle(text) {

    let title =
        text
            .replace(/\s+/g, " ")
            .trim();

    if (title.length > 34) {

        title =
            title.substring(0, 34) + "…";
    }

    return title || "New conversation";
}


/* =========================================
   RENDER CHAT LIST
========================================= */

function renderChatList() {

    chatList.innerHTML = "";

    if (chats.length === 0) {

        const empty =
            document.createElement("div");

        empty.style.padding =
            "20px 8px";

        empty.style.textAlign =
            "center";

        empty.style.color =
            "#aaa4b4";

        empty.style.fontSize =
            "12px";

        empty.textContent =
            "No saved conversations yet.";

        chatList.appendChild(empty);

        return;
    }

    chats.forEach(savedChat => {

        const item =
            document.createElement("div");

        item.className =
            "chat-item" +
            (
                savedChat.id === currentChatId
                    ? " active"
                    : ""
            );

        item.onclick = () =>
            openChat(savedChat.id);


        const icon =
            document.createElement("div");

        icon.className =
            "chat-icon";

        icon.textContent =
            "✦";


        const title =
            document.createElement("div");

        title.className =
            "chat-title";

        title.textContent =
            savedChat.title;


        const deleteButton =
            document.createElement("button");

        deleteButton.className =
            "delete-chat";

        deleteButton.textContent =
            "×";

        deleteButton.title =
            "Delete conversation";


        deleteButton.onclick =
            event => {

                event.stopPropagation();

                deleteChat(
                    savedChat.id
                );
            };


        item.appendChild(icon);

        item.appendChild(title);

        item.appendChild(deleteButton);

        chatList.appendChild(item);

    });
}


/* =========================================
   OPEN CHAT
========================================= */

function openChat(id) {

    const selected =
        chats.find(
            savedChat =>
                savedChat.id === id
        );

    if (!selected) {
        return;
    }

    currentChatId = id;

    history =
        [...selected.messages];

    renderMessages();

    renderChatList();

    closeSidebarOnMobile();
}


/* =========================================
   DELETE CHAT
========================================= */

function deleteChat(id) {

    chats =
        chats.filter(
            savedChat =>
                savedChat.id !== id
        );

    if (currentChatId === id) {

        currentChatId = null;

        history = [];

        renderMessages();
    }

    saveChats();
}


/* =========================================
   DELETE ALL
========================================= */

function deleteAllChats() {

    if (chats.length === 0) {
        return;
    }

    const confirmed =
        confirm(
            "Delete all saved conversations?"
        );

    if (!confirmed) {
        return;
    }

    chats = [];

    currentChatId = null;

    history = [];

    localStorage.removeItem(
        STORAGE_KEY
    );

    renderChatList();

    renderMessages();
}


/* =========================================
   SAVE CURRENT CONVERSATION
========================================= */

function saveCurrentChat() {

    if (!history.length) {
        return;
    }

    let selected =
        getCurrentChat();


    if (!selected) {

        selected =
            createChat();
    }


    selected.messages =
        [...history];


    const firstUserMessage =
        history.find(
            message =>
                message.role === "user"
        );


    if (
        firstUserMessage &&
        (
            selected.title ===
            "New conversation"
        )
    ) {

        selected.title =
            makeTitle(
                firstUserMessage.content
            );
    }


    selected.updatedAt =
        Date.now();


    saveChats();
}


/* =========================================
   RENDER MESSAGES
========================================= */

function renderMessages() {

    chat.innerHTML = "";

    if (!history.length) {

        chat.innerHTML = `
            <div class="welcome" id="welcome">

                <div class="welcome-orb">
                    ✦
                </div>

                <h2>Meet EriAI</h2>

                <p>
                    Your personal AI assistant,
                    powered locally on your Mac.
                </p>

                <div class="suggestions">

                    <button
                        class="suggestion"
                        onclick="useSuggestion('What can you do?')"
                    >
                        What can you do?
                    </button>

                    <button
                        class="suggestion"
                        onclick="useSuggestion('Tell me something interesting')"
                    >
                        Tell me something interesting
                    </button>

                    <button
                        class="suggestion"
                        onclick="useSuggestion('Help me learn something new')"
                    >
                        Help me learn something new
                    </button>

                </div>

            </div>
        `;

        return;
    }


    history.forEach(message => {

        addMessageElement(
            message.role,
            message.content
        );

    });


    chat.scrollTop =
        chat.scrollHeight;
}


/* =========================================
   ADD MESSAGE ELEMENT
========================================= */

function addMessageElement(
    role,
    text
) {

    const message =
        document.createElement("div");

    message.className =
        "message " + role;


    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    bubble.textContent =
        text;


    message.appendChild(
        bubble
    );

    chat.appendChild(
        message
    );

    return message;
}


/* =========================================
   THINKING
========================================= */

function addThinking() {

    const message =
        document.createElement("div");

    message.className =
        "message assistant";

    message.id =
        "thinking-message";


    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    bubble.innerHTML = `
        <div class="thinking">
            <span></span>
            <span></span>
            <span></span>
        </div>
    `;


    message.appendChild(
        bubble
    );

    chat.appendChild(
        message
    );

    chat.scrollTop =
        chat.scrollHeight;
}


/* =========================================
   SEND QUESTION
========================================= */

async function askEriAI() {

    const question =
        questionInput.value.trim();

    if (!question) {
        return;
    }


    /*
       Create a saved chat only when
       the user actually sends something.
    */

    if (!currentChatId) {

        const newConversation =
            createChat();

        currentChatId =
            newConversation.id;
    }


    questionInput.value = "";

    questionInput.style.height =
        "48px";


    addMessageElement(
        "user",
        question
    );


    history.push({
        role: "user",
        content: question
    });


    saveCurrentChat();

    addThinking();


    try {

        const response =
            await fetch(
                "/ask",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            question:
                                question,

                            history:
                                history.slice(
                                    0,
                                    -1
                                )

                        })
                }
            );


        if (!response.ok) {

            throw new Error(
                "Server returned " +
                response.status
            );
        }


        const data =
            await response.json();


        const thinking =
            document.getElementById(
                "thinking-message"
            );


        if (thinking) {
            thinking.remove();
        }


        const answer =
            data.answer ||
            "Sorry, I couldn't generate a response.";


        addMessageElement(
            "assistant",
            answer
        );


        history.push({
            role: "assistant",
            content: answer
        });


        saveCurrentChat();


        chat.scrollTop =
            chat.scrollHeight;


    } catch (error) {

        console.error(
            "EriAI error:",
            error
        );


        const thinking =
            document.getElementById(
                "thinking-message"
            );


        if (thinking) {
            thinking.remove();
        }


        const errorMessage =
            "Something went wrong. Please make sure EriAI is running.";


        addMessageElement(
            "assistant",
            errorMessage
        );

    }
}


/* =========================================
   SUGGESTIONS
========================================= */

function useSuggestion(text) {

    questionInput.value =
        text;

    questionInput.focus();
}


/* =========================================
   SIDEBAR
========================================= */

function toggleSidebar() {

    document
        .getElementById("sidebar")
        .classList.toggle("open");
}


function closeSidebarOnMobile() {

    if (
        window.innerWidth <= 750
    ) {

        document
            .getElementById("sidebar")
            .classList.remove("open");
    }
}


/* =========================================
   ENTER TO SEND
========================================= */

questionInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            askEriAI();
        }
    }
);


/* =========================================
   AUTO RESIZE TEXTAREA
========================================= */

questionInput.addEventListener(
    "input",
    function() {

        this.style.height =
            "48px";

        this.style.height =
            Math.min(
                this.scrollHeight,
                150
            ) + "px";
    }
);


/* =========================================
   START EriAI
========================================= */

loadChats();

</script>
