
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EriAI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #f7f8ff;
            --text: #171425;
            --muted: #77728c;

            --purple: #8b5cf6;
            --blue: #4f8cff;
            --pink: #ed5bd7;

            --glass: rgba(255, 255, 255, 0.72);
            --glass-strong: rgba(255, 255, 255, 0.9);

            --border: rgba(119, 87, 190, 0.16);
        }

        body {
            min-height: 100vh;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            color: var(--text);

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(139, 92, 246, 0.20),
                    transparent 25%
                ),
                radial-gradient(
                    circle at 90% 10%,
                    rgba(79, 140, 255, 0.20),
                    transparent 25%
                ),
                radial-gradient(
                    circle at 50% 100%,
                    rgba(237, 91, 215, 0.14),
                    transparent 30%
                ),
                var(--bg);

            overflow: hidden;
        }

        /* Floating ambient glow */

        body::before,
        body::after {
            content: "";

            position: fixed;

            width: 420px;
            height: 420px;

            border-radius: 50%;

            filter: blur(100px);

            opacity: 0.20;

            pointer-events: none;

            animation:
                floatingGlow
                12s ease-in-out infinite alternate;
        }

        body::before {
            background: var(--purple);

            left: -180px;
            top: -160px;
        }

        body::after {
            background: var(--blue);

            right: -180px;
            bottom: -180px;

            animation-delay: -5s;
        }

        @keyframes floatingGlow {

            from {
                transform:
                    translate(0, 0)
                    scale(1);
            }

            to {
                transform:
                    translate(70px, 50px)
                    scale(1.18);
            }
        }

        .app {
            position: relative;

            width: 100%;
            height: 100vh;

            max-width: 1200px;

            margin: auto;

            display: flex;
            flex-direction: column;

            background:
                rgba(255, 255, 255, 0.30);

            backdrop-filter: blur(20px);
        }

        /* HEADER */

        header {
            height: 78px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 28px;

            border-bottom:
                1px solid var(--border);

            background:
                rgba(255, 255, 255, 0.62);

            backdrop-filter: blur(25px);
        }

        .brand {
            display: flex;
            align-items: center;

            gap: 13px;
        }

        .logo {
            width: 45px;
            height: 45px;

            border-radius: 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 22px;

            background:
                linear-gradient(
                    135deg,
                    #a875ff,
                    #5797ff,
                    #ef72dc
                );

            box-shadow:
                0 8px 25px
                rgba(139, 92, 246, 0.28),

                0 0 30px
                rgba(79, 140, 255, 0.18);

            animation:
                logoGlow
                3s ease-in-out infinite;
        }

        @keyframes logoGlow {

            0%,
            100% {
                transform: translateY(0);

                box-shadow:
                    0 8px 25px
                    rgba(139, 92, 246, 0.28);
            }

            50% {
                transform: translateY(-2px);

                box-shadow:
                    0 10px 35px
                    rgba(139, 92, 246, 0.42),

                    0 0 45px
                    rgba(79, 140, 255, 0.20);
            }
        }

        .brand h1 {
            font-size: 19px;

            font-weight: 750;

            letter-spacing: -0.4px;
        }

        .status {
            display: flex;
            align-items: center;

            gap: 7px;

            margin-top: 3px;

            color: #8a849b;

            font-size: 12px;
        }

        .status-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #28c979;

            box-shadow:
                0 0 8px
                rgba(40, 201, 121, 0.8);

            animation:
                statusPulse
                2s infinite;
        }

        @keyframes statusPulse {

            50% {
                opacity: 0.4;
            }
        }

        .clear-btn {
            padding: 9px 14px;

            border-radius: 11px;

            border:
                1px solid
                var(--border);

            background:
                rgba(255,255,255,0.65);

            color: #6e6880;

            cursor: pointer;

            transition: 0.2s;

            box-shadow:
                0 4px 15px
                rgba(80, 60, 120, 0.05);
        }

        .clear-btn:hover {
            color: #5c39aa;

            border-color:
                rgba(139,92,246,0.35);

            background:
                rgba(255,255,255,0.9);

            transform:
                translateY(-1px);

            box-shadow:
                0 8px 25px
                rgba(139,92,246,0.12);
        }

        /* CHAT */

        #chat {
            flex: 1;

            overflow-y: auto;

            padding:
                40px
                22px
                180px;

            scroll-behavior: smooth;
        }

        #chat::-webkit-scrollbar {
            width: 6px;
        }

        #chat::-webkit-scrollbar-thumb {
            background:
                rgba(139,92,246,0.20);

            border-radius: 20px;
        }

        /* WELCOME */

        .welcome {
            max-width: 720px;

            margin:
                10vh auto
                0;

            text-align: center;

            animation:
                appear
                0.8s ease;
        }

        @keyframes appear {

            from {
                opacity: 0;
                transform:
                    translateY(18px);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0);
            }
        }

        .welcome-orb {
            width: 92px;
            height: 92px;

            margin:
                0 auto
                25px;

            border-radius: 29px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 39px;

            background:
                linear-gradient(
                    135deg,
                    #b38aff,
                    #6fa8ff,
                    #f08bdf
                );

            color: white;

            box-shadow:
                0 15px 45px
                rgba(139,92,246,0.28),

                0 0 70px
                rgba(79,140,255,0.16);

            animation:
                orbFloat
                4s ease-in-out infinite;
        }

        @keyframes orbFloat {

            0%,
            100% {
                transform:
                    translateY(0)
                    rotate(0deg);
            }

            50% {
                transform:
                    translateY(-6px)
                    rotate(2deg);
            }
        }

        .welcome h2 {
            font-size:
                clamp(
                    34px,
                    6vw,
                    56px
                );

            letter-spacing: -2.5px;

            background:
                linear-gradient(
                    100deg,
                    #28213b,
                    #8052d8,
                    #4384dd
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color:
                transparent;
        }

        .welcome p {
            margin-top: 12px;

            color: var(--muted);

            font-size: 15px;
        }

        .suggestions {
            display: flex;

            flex-wrap: wrap;

            justify-content: center;

            gap: 10px;

            margin-top: 28px;
        }

        .suggestion {
            padding:
                11px
                15px;

            border-radius: 14px;

            border:
                1px solid
                var(--border);

            background:
                rgba(255,255,255,0.62);

            color: #686177;

            cursor: pointer;

            transition: 0.2s;

            box-shadow:
                0 5px 18px
                rgba(70,50,110,0.04);
        }

        .suggestion:hover {
            transform:
                translateY(-3px);

            color:
                #6742b1;

            border-color:
                rgba(139,92,246,0.35);

            background:
                rgba(255,255,255,0.9);

            box-shadow:
                0 10px 30px
                rgba(139,92,246,0.12);
        }

        /* MESSAGES */

        .message {
            display: flex;

            max-width: 850px;

            margin:
                18px auto;

            animation:
                messageIn
                0.35s ease;
        }

        .message.user {
            justify-content: flex-end;
        }

        .bubble {
            max-width: 75%;

            padding:
                14px
                17px;

            border-radius: 18px;

            font-size: 15px;

            line-height: 1.65;

            white-space: pre-wrap;
        }

        .user .bubble {
            color: white;

            background:
                linear-gradient(
                    135deg,
                    #8b5cf6,
                    #578cff
                );

            border-bottom-right-radius:
                5px;

            box-shadow:
                0 10px 30px
                rgba(98,76,220,0.20);
        }

        .assistant .bubble {
            background:
                rgba(255,255,255,0.78);

            border:
                1px solid
                rgba(139,92,246,0.12);

            border-bottom-left-radius:
                5px;

            box-shadow:
                0 8px 30px
                rgba(70,50,110,0.07);

            backdrop-filter:
                blur(18px);
        }

        @keyframes messageIn {

            from {
                opacity: 0;

                transform:
                    translateY(10px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }
        }

        /* THINKING */

        .thinking {
            display: flex;

            align-items: center;

            gap: 5px;
        }

        .thinking span {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background:
                #8b5cf6;

            animation:
                thinking
                1.2s infinite;
        }

        .thinking span:nth-child(2) {
            animation-delay:
                0.15s;
        }

        .thinking span:nth-child(3) {
            animation-delay:
                0.3s;
        }

        @keyframes thinking {

            0%,
            60%,
            100% {
                transform:
                    translateY(0);

                opacity:
                    0.35;
            }

            30% {
                transform:
                    translateY(-5px);

                opacity:
                    1;
            }
        }

        /* COMPOSER */

        .composer-area {
            position: absolute;

            left: 0;
            right: 0;
            bottom: 0;

            padding:
                20px
                22px
                25px;

            background:
                linear-gradient(
                    to top,
                    rgba(247,248,255,0.98),
                    rgba(247,248,255,0.80),
                    transparent
                );
        }

        .composer {
            max-width: 850px;

            margin: auto;

            display: flex;

            align-items: flex-end;

            gap: 10px;

            padding: 10px;

            border:
                1px solid
                rgba(139,92,246,0.18);

            border-radius: 21px;

            background:
                rgba(255,255,255,0.82);

            backdrop-filter:
                blur(25px);

            box-shadow:
                0 12px 45px
                rgba(70,50,120,0.10),

                0 0 40px
                rgba(139,92,246,0.05);

            transition: 0.25s;
        }

        .composer:focus-within {
            border-color:
                rgba(139,92,246,0.48);

            box-shadow:
                0 12px 50px
                rgba(70,50,120,0.12),

                0 0 40px
                rgba(139,92,246,0.12);
        }

        textarea {
            flex: 1;

            min-height: 48px;
            max-height: 150px;

            resize: none;

            padding:
                13px
                12px;

            border: none;

            outline: none;

            background:
                transparent;

            color:
                #211b30;

            font:
                inherit;

            font-size: 15px;
        }

        textarea::placeholder {
            color:
                #aaa4b7;
        }

        #send {
            width: 48px;
            height: 48px;

            border: none;

            border-radius: 15px;

            color: white;

            font-size: 18px;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    #9a67fa,
                    #5b91ff
                );

            box-shadow:
                0 8px 25px
                rgba(105,80,220,0.25);

            transition: 0.2s;
        }

        #send:hover {
            transform:
                translateY(-2px)
                scale(1.03);

            box-shadow:
                0 10px 35px
                rgba(105,80,220,0.38);
        }

        #send:active {
            transform:
                scale(0.94);
        }

        .footer {
            text-align: center;

            margin-top: 8px;

            font-size: 11px;

            color:
                #aaa5b5;
        }

        @media (max-width: 650px) {

            header {
                padding:
                    0 16px;
            }

            #chat {
                padding:
                    30px
                    14px
                    175px;
            }

            .bubble {
                max-width: 88%;
            }

            .welcome {
                margin-top:
                    8vh;
            }

            .welcome h2 {
                letter-spacing:
                    -1px;
            }

            .clear-btn {
                padding:
                    8px 10px;

                font-size:
                    12px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <header>

        <div class="brand">

            <div class="logo">
                🤖
            </div>

            <div>

                <h1>EriAI</h1>

                <div class="status">
                    <span class="status-dot"></span>
                    Local AI • Online
                </div>

            </div>

        </div>

        <button
            class="clear-btn"
            onclick="clearChat()"
        >
            Clear
        </button>

    </header>


    <main id="chat">

        <div
            class="welcome"
            id="welcome"
        >

            <div class="welcome-orb">
                ✦
            </div>

            <h2>
                Meet EriAI
            </h2>

            <p>
                Your personal AI assistant,
                powered locally on your Mac.
            </p>

            <div class="suggestions">

                <button
                    class="suggestion"
                    onclick="useSuggestion('What can you do?')"
                >
                    What can you do?
                </button>

                <button
                    class="suggestion"
                    onclick="useSuggestion('Tell me something interesting')"
                >
                    Tell me something interesting
                </button>

                <button
                    class="suggestion"
                    onclick="useSuggestion('Help me learn something new')"
                >
                    Help me learn something new
                </button>

            </div>

        </div>

    </main>


    <div class="composer-area">

        <div class="composer">

            <textarea
                id="question"
                placeholder="Message EriAI..."
                rows="1"
            ></textarea>

            <button
                id="send"
                onclick="askEriAI()"
                aria-label="Send"
            >
                ➤
            </button>

        </div>

        <div class="footer">
            EriAI runs locally with Ollama
        </div>

    </div>

</div>


<script>

    const questionInput =
        document.getElementById("question");

    const chat =
        document.getElementById("chat");

    const welcome =
        document.getElementById("welcome");

    let history = [];


    function useSuggestion(text) {

        questionInput.value = text;

        questionInput.focus();

    }


    function addMessage(role, text) {

        if (welcome) {
            welcome.remove();
        }

        const message =
            document.createElement("div");

        message.className =
            "message " + role;

        const bubble =
            document.createElement("div");

        bubble.className =
            "bubble";

        bubble.textContent =
            text;

        message.appendChild(bubble);

        chat.appendChild(message);

        chat.scrollTop =
            chat.scrollHeight;

        return message;
    }


    function addThinking() {

        if (welcome) {
            welcome.remove();
        }

        const message =
            document.createElement("div");

        message.className =
            "message assistant";

        message.id =
            "thinking-message";

        const bubble =
            document.createElement("div");

        bubble.className =
            "bubble";

        bubble.innerHTML = `
            <div class="thinking">
                <span></span>
                <span></span>
                <span></span>
            </div>
        `;

        message.appendChild(bubble);

        chat.appendChild(message);

        chat.scrollTop =
            chat.scrollHeight;
    }


    async function askEriAI() {

        const question =
            questionInput.value.trim();

        if (!question) {
            return;
        }

        questionInput.value = "";

        questionInput.style.height =
            "48px";

        addMessage(
            "user",
            question
        );

        history.push({
            role: "user",
            content: question
        });

        addThinking();

        try {

            const response =
                await fetch(
                    "/ask",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                question:
                                    question,

                                history:
                                    history.slice(
                                        0,
                                        -1
                                    )
                            })
                    }
                );

            const data =
                await response.json();

            const thinking =
                document.getElementById(
                    "thinking-message"
                );

            if (thinking) {
                thinking.remove();
            }

            const answer =
                data.answer ||
                "Sorry, I couldn't generate a response.";

            addMessage(
                "assistant",
                answer
            );

            history.push({
                role: "assistant",
                content: answer
            });

        } catch (error) {

            const thinking =
                document.getElementById(
                    "thinking-message"
                );

            if (thinking) {
                thinking.remove();
            }

            addMessage(
                "assistant",
                "Something went wrong. Please try again."
            );

            console.error(error);
        }
    }


    function clearChat() {

        history = [];

        chat.innerHTML = `
            <div
                class="welcome"
                id="welcome"
            >

                <div class="welcome-orb">
                    ✦
                </div>

                <h2>
                    Meet EriAI
                </h2>

                <p>
                    Your personal AI assistant,
                    powered locally on your Mac.
                </p>

                <div class="suggestions">

                    <button
                        class="suggestion"
                        onclick="useSuggestion('What can you do?')"
                    >
                        What can you do?
                    </button>

                    <button
                        class="suggestion"
                        onclick="useSuggestion('Tell me something interesting')"
                    >
                        Tell me something interesting
                    </button>

                    <button
                        class="suggestion"
                        onclick="useSuggestion('Help me learn something new')"
                    >
                        Help me learn something new
                    </button>

                </div>

            </div>
        `;
    }


    questionInput.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                askEriAI();
            }
        }
    );


    questionInput.addEventListener(
        "input",
        function() {

            this.style.height =
                "48px";

            this.style.height =
                Math.min(
                    this.scrollHeight,
                    150
                ) + "px";
        }
    );

</script>

</body>
</html>
